apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: gik-icechain-c1
  labels:
    component: c1-ingest
    pipeline: gik-icechain
spec:
  template:
    spec:
      template:
        spec:
          serviceAccountName: gik-icechain-sa@PROJECT_ID.iam.gserviceaccount.com
          containers:
            - image: ghcr.io/hashirama21/gik-icechain:latest
              command: ["/bin/sh", "-c"]
              args:
                - "gik-icechain convert --start ${TARGET_DATE} --end ${TARGET_DATE} --output-store ${GIK_ICECHUNK_STORE_URI} --config configs/default.yaml"
              resources:
                limits:
                  cpu: "4"
                  memory: 16Gi
              env:
                - name: TARGET_DATE
                  value: ""
                - name: GIK_ICECHUNK_STORE_URI
                  valueFrom:
                    secretKeyRef:
                      name: gik-icechain-secrets
                      key: icechunk-store-uri
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: gik-icechain-secrets
                      key: aws-access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gik-icechain-secrets
                      key: aws-secret-access-key
                - name: HDF5_USE_FILE_LOCKING
                  value: "FALSE"
                - name: PYTHONIOENCODING
                  value: "utf-8"
          maxRetries: 2
          timeoutSeconds: 3600
