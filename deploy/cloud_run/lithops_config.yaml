lithops:
  backend: gcp_functions
  storage: gcs
  log_level: INFO
  execution_timeout: 3600
  worker_processes: 4

gcp_functions:
  project_name: PROJECT_ID
  region: europe-west1
  runtime: gik-icechain-runtime
  runtime_memory: 8192
  runtime_timeout: 540
  max_workers: 50

gcs:
  project_name: PROJECT_ID
  storage_bucket: gik-icechain-lithops

standalone:
  backend: gcp_compute
  instance_type: n2-standard-16
  region: europe-west1
  runtime: gik-icechain-runtime
