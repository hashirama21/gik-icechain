repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (src/gik_icechain)
        entry: mypy src/gik_icechain/ --ignore-missing-imports
        language: system
        types: [python]
        pass_filenames: false