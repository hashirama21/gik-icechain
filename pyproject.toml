[build-system]
requires      = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name        = "gik-icechain"
version     = "2.0.0"
description = "Zero-Cost Cloud-Native Pipeline for Retrospective Flood Risk Decision Support in East Africa"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.12"

authors = [
  { name = "Vincess Dongmo",  email = "sodiaque806@gmail.com" },
  { name = "Dylan Kemekoum",  email = "kemekoum.dylan@gmail.com" },
  { name = "Donald Feudjio",   email = "feudjiodonal78@gmail.com" },
  { name = "Chris Venyl" },
]

maintainers = [
  { name = "SYNTHI-AI Inc." },
]

keywords = [
  "ecmwf", "ifs", "ensemble", "zarr", "icechunk", "virtualizarr",
  "flood", "risk", "east-africa", "bayesian", "cloud-native", "grib2",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "zarr>=3.0.8",
  "icechunk>=2.0.5",
  "virtualizarr>=2.0",
  "obstore>=0.9",
  "obspec-utils>=0.9",

  "xarray>=2025.1.2",
  "dask[distributed]>=2025.1.0",

  "fsspec[s3]>=2024.12.0",
  "s3fs>=2024.12.0",
  "gcsfs>=2024.12.0",
  "huggingface-hub>=0.23",

  "pyarrow>=16.0",

  # GRIB2 decoding
  "kerchunk>=0.2",
  "cfgrib>=0.9.14",
  "eccodes>=2.38.0",

  # NetCDF backends
  "h5netcdf>=1.3",
  "netcdf4>=1.7",
  "h5py>=3.10",

  # Scientific stack
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",

  # Geospatial
  "geopandas>=1.0",
  "regionmask>=0.12",
  "shapely>=2.0",
  "pyproj>=3.7",
  "rioxarray>=0.17",

  "pgmpy>=1.0",

  # Configuration
  "pydantic>=2.7",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "pyyaml>=6.0",

  # CLI
  "click>=8.1",
  "rich>=13.7",
  "typer>=0.12",
  "cdsapi>=0.7.7",
  "requests>=2.31",

  # Logging
  "structlog>=24.1",
]

[project.optional-dependencies]

# Visualization + dashboard
viz = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "cartopy>=0.23",
  "hvplot>=0.9",
  "panel>=1.4",
  "folium>=0.17",
  "branca>=0.7",
  "jinja2>=3.1",
  "tabulate>=0.9",
  "rasterio>=1.3",
  "geocube>=0.4",
  "pystac>=1.8",
]

# Development tools
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.5",       # parallel tests
  "pytest-timeout>=2.3",
  "pytest-mock>=3.12",
  "hypothesis>=6.100",        # property-based tests
  "ruff>=0.4",
  "mypy==2.1.0",                # pinned so local == CI
  "pandas-stubs==3.0.3.260530", # typed pandas: local mypy matches CI strictness
  "pre-commit>=3.7",
  "ipykernel>=6.29",
  "nbmake>=1.5",              # notebook tests
]

cloud = [
  "lithops>=2.9",
  "google-cloud-run>=0.10",
  "boto3>=1.34",
]

# Reading the published era-groups store (gribberish Zarr v3 codec)
published = [
  "gribberish>=1.4",
]

full = [
  "gik-icechain[viz,dev,cloud,published]",
]

[project.scripts]
gik-icechain = "gik_icechain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gik_icechain"]


[tool.ruff]
target-version = "py312"
line-length    = 100
src            = ["src"]
exclude        = ["notebooks/"]

[tool.ruff.lint]
select = [
  "E", "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "SIM",
  "TID",
  "ANN",
  "RUF",
]
ignore = [
  "ANN001",
  "ANN002",
  "ANN201",
  "ANN202",
  "ANN401",
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"notebooks/**" = ["ANN", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy
[tool.mypy]
python_version         = "3.12"
ignore_missing_imports = true
warn_return_any        = false
check_untyped_defs     = true
plugins                = ["pydantic.mypy"]

# Pytest
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = ["-ra", "--strict-markers", "--tb=short"]
timeout      = 120
markers = [
  "slow: marks tests that take > 30s (deselect with -m 'not slow')",
  "integration: marks integration tests (require AWS credentials)",
  "unit: marks pure unit tests (no external dependencies)",
]
filterwarnings = [
  "ignore::DeprecationWarning:zarr",
  "ignore::UserWarning:xarray",
]

# Coverage
[tool.coverage.run]
source      = ["src"]
branch      = true
omit        = [
  "*/__main__.py",
  "*/cli.py",
  "*/conversion/gap_filler.py",
  "*/conversion/benchmark.py",
  "*/conversion/aifs_discovery.py",
  "*/exceedance/aifs_track.py",
  "*/exceedance/icechunk_output.py",
  "*/shared/storage.py",
  "*/shared/logging.py",
  "*/shared/validation.py",
]

[tool.coverage.report]
show_missing  = true
fail_under    = 45  # keep in sync with CI's --cov-fail-under (.github/workflows/ci.yaml)
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
