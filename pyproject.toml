[build-system]
requires      = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name        = "gik-icechain"
version     = "2.0.0"
description = "Zero-Cost Cloud-Native Pipeline for Retrospective Flood Risk Decision Support in East Africa"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.11"

authors = [
  { name = "Code for Earth 2026 Team" },
]

keywords = [
  "ecmwf", "ifs", "ensemble", "zarr", "icechunk", "virtualizarr",
  "flood", "risk", "east-africa", "bayesian", "cloud-native", "grib2",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "zarr>=3.0.8",
  "icechunk>=1.0",
  "virtualizarr>=1.0",
  "xarray>=2025.1.2",
  "dask[distributed]>=2025.1.0",
  "fsspec[s3]>=2024.12.0",
  "s3fs>=2024.12.0",
  "gcsfs>=2024.12.0",

  # GRIB2 decoding
  "cfgrib>=0.9.14",
  "eccodes>=2.38.0",

  # Scientific stack
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",

  # Geospatial
  "geopandas>=1.0",
  "regionmask>=0.12",
  "shapely>=2.0",
  "pyproj>=3.7",
  "rioxarray>=0.17",

  "pgmpy>=0.1.26",

  # Data access
  "huggingface-hub>=0.23",

  # Configuration
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",

  # CLI
  "click>=8.1",
  "rich>=13.7",
  "typer>=0.12",

  # Logging
  "structlog>=24.1",
]

[project.optional-dependencies]

# Visualization + dashboard
viz = [
  "matplotlib>=3.8",
  "cartopy>=0.23",
  "hvplot>=0.9",
  "panel>=1.4",
  "folium>=0.17",
  "branca>=0.7",
  "jinja2>=3.1",
]

# Development tools
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.5",       # parallel tests
  "pytest-timeout>=2.3",
  "pytest-mock>=3.12",
  "hypothesis>=6.100",        # property-based tests
  "ruff>=0.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "ipykernel>=6.29",
  "nbmake>=1.5",              # notebook tests
]

# Cloud deployment
cloud = [
  "lithops>=2.9",
  "google-cloud-run>=0.10",
  "boto3>=1.34",
]

# Full install (all optional groups)
full = [
  "gik-icechain[viz,dev,cloud]",
]

[project.scripts]
gik-icechain = "gik_icechain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gik_icechain"]

# Ruff (linter + formatter)
[tool.ruff]
target-version = "py311"
line-length    = 100
src            = ["src"]

[tool.ruff.lint]
select = [
  "E", "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "SIM",
  "TID",
  "ANN",
  "RUF",
]
ignore = [
  "ANN401",
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"notebooks/**" = ["ANN", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy
[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true
warn_return_any        = false
plugins                = ["pydantic.mypy"]

# Pytest
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = ["-ra", "--strict-markers", "--tb=short"]
timeout      = 120
markers = [
  "slow: marks tests that take > 30s (deselect with -m 'not slow')",
  "integration: marks integration tests (require AWS credentials)",
  "unit: marks pure unit tests (no external dependencies)",
]
filterwarnings = [
  "ignore::DeprecationWarning:zarr",
  "ignore::UserWarning:xarray",
]

# Coverage
[tool.coverage.run]
source      = ["src"]
branch      = true
omit        = ["*/__main__.py", "*/cli.py"]

[tool.coverage.report]
show_missing  = true
fail_under    = 80
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
