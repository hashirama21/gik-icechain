name: E2E Pipeline Run (MinIO store)

# Runs the full C1 -> C2 -> C3 pipeline on a GitHub-hosted runner against the
# dev MinIO store. The runner reaches MinIO over its public Azure IP and reads
# the public ECMWF IFS ENS archive on s3://ecmwf-forecasts anonymously —
# cloud-to-cloud bandwidth makes the 1.2 GB/day byte-range fetch fast and
# reliable, unlike a high-latency local WAN link.
#
# Manual trigger only. Pick a forecast date that is BOTH in the GIK catalog
# AND within the ~15-month ECMWF S3 public retention window.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First forecast date YYYY-MM-DD (in GIK catalog & < ~15 months old)"
        required: true
        default: "2025-10-24"
      end_date:
        description: "Last forecast date YYYY-MM-DD (>= start; runtime scales with span)"
        required: false
        default: ""

env:
  PYTHONIOENCODING: utf-8

jobs:
  e2e:
    name: "run-all (C1 -> C2 -> C3 -> validation, MinIO)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev

      - name: Install eccodes system library (GRIB2 decode)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-tools

      - name: Download reference data (admin, thresholds, ENSO/IOD)
        run: python scripts/tools.py download --component all

      - name: Download pre-fitted GEV thresholds
        run: python scripts/tools.py download-thresholds

      - name: Resolve date range
        id: range
        run: |
          START="${{ inputs.start_date }}"
          END="${{ inputs.end_date }}"
          [ -z "$END" ] && END="$START"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Pipeline range: $START -> $END"

      - name: Download observed rainfall for C3 (CHIRPS, no auth)
        run: |
          START=$(python -c "from datetime import date,timedelta;print(date.fromisoformat('${{ steps.range.outputs.start }}')-timedelta(14))")
          python scripts/tools.py download-gpm --source chirps --start "$START" --end "${{ steps.range.outputs.end }}"

      - name: Run full pipeline (C1 -> C2 -> C3)
        env:
          ECCODES_PYTHON_USE_FINDLIBS: "1"
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
        run: |
          python -m gik_icechain run-all \
            --start "${{ steps.range.outputs.start }}" \
            --end   "${{ steps.range.outputs.end }}" \
            --config configs/default.yaml \
            --output results/

      - name: EM-DAT validation (event-level early detection)
        if: always()
        run: |
          python scripts/tools.py validate-emdat \
            --risk-dir results/admin1_risk \
            --start "${{ steps.range.outputs.start }}" \
            --end   "${{ steps.range.outputs.end }}" \
            --event-level --lead-days 1 \
          || echo "validate-emdat produced no metrics (no EM-DAT match in range?)"

      - name: Risk score summary
        if: always()
        run: |
          python - <<'EOF'
          import glob, json
          files = sorted(glob.glob("results/admin1_risk/*_risk_scores.json"))
          if not files:
              print("No risk score files produced.")
              raise SystemExit(0)
          for f in files:
              data = json.load(open(f))
              units = data.get("units", {})
              counts = {}
              for u in units.values():
                  lbl = u.get("risk_label", "?")
                  counts[lbl] = counts.get(lbl, 0) + 1
              print(f"{data.get('date')}: {len(units)} units -> {dict(sorted(counts.items()))}")
          EOF

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ steps.range.outputs.start }}
          path: |
            results/admin1_risk/
            results/validation/
          retention-days: 14
          if-no-files-found: warn
