name: E2E Pipeline Run (local store)

# Runs the full C1 -> C2 -> C3 pipeline on a GitHub-hosted runner using a
# LOCAL filesystem IceChunk store (no MinIO). The runner reads the public
# ECMWF IFS ENS archive on s3://ecmwf-forecasts anonymously — cloud-to-cloud
# bandwidth makes the 1.2 GB/day byte-range fetch fast and reliable, unlike a
# high-latency local WAN link.
#
# Manual trigger only. Pick a forecast date that is BOTH in the GIK catalog
# AND within the ~15-month ECMWF S3 public retention window.

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Forecast date YYYY-MM-DD (in GIK catalog & < ~15 months old)"
        required: true
        default: "2025-10-24"

env:
  PYTHONIOENCODING: utf-8

jobs:
  e2e:
    name: "run-all (C1 -> C2 -> C3, local store)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev

      - name: Install eccodes system library (GRIB2 decode)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-tools

      - name: Download reference data (admin, thresholds, ENSO/IOD)
        run: python scripts/tools.py download --component all

      - name: Run full pipeline
        env:
          ECCODES_PYTHON_USE_FINDLIBS: "1"
        run: |
          python -m gik_icechain run-all \
            --start "${{ inputs.target_date }}" \
            --end   "${{ inputs.target_date }}" \
            --config configs/ci_e2e.yaml \
            --output results/ci_e2e/

      - name: Risk score summary
        if: always()
        run: |
          python - <<'EOF'
          import glob, json
          files = sorted(glob.glob("results/ci_e2e/admin1_risk/*_risk_scores.json"))
          if not files:
              print("No risk score files produced.")
              raise SystemExit(0)
          for f in files:
              data = json.load(open(f))
              units = data.get("units", {})
              counts = {}
              for u in units.values():
                  lbl = u.get("risk_label", "?")
                  counts[lbl] = counts.get(lbl, 0) + 1
              print(f"{data.get('date')}: {len(units)} units -> {dict(sorted(counts.items()))}")
          EOF

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ inputs.target_date }}
          path: |
            results/ci_e2e/
          retention-days: 14
          if-no-files-found: warn
