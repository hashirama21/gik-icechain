name: CI

on:
  push:
    branches: [main, develop, optimize]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check src/ tests/ scripts/"
      - run: mypy src/gik_icechain/ --ignore-missing-imports

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev
      - run: |
          pytest tests/unit/ -v --tb=short \
            --cov=src/gik_icechain \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --timeout=60
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev
      - run: pytest tests/integration/ -v --tb=short -m integration --timeout=300

  notebooks:
    name: Notebook Tests
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev
      - run: |
          pytest --nbmake \
            notebooks/00_quickstart.ipynb \
            notebooks/01_component1_walkthrough.ipynb \
            notebooks/02_component2_walkthrough.ipynb \
            notebooks/03_component3_walkthrough.ipynb \
            --nbmake-timeout=600 \
            -v
