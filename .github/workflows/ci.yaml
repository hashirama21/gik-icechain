# .github/workflows/ci.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Continuous Integration for GIK-IceChain
#
# Jobs:
#   1. lint      — ruff check + mypy
#   2. test-unit — pytest (unit tests only, no cloud credentials needed)
#   3. test-int  — pytest integration tests (local tmp-path, no AWS required)
#   4. notebooks — nbmake validates quickstart + walkthrough notebooks
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop, optimize]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:

  # 1. Lint — ruff + mypy
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: "check src/ tests/ scripts/"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package for mypy
        run: pip install -e ".[dev]" mypy

      - name: mypy
        run: mypy src/gik_icechain/ --ignore-missing-imports

  # 2. Unit Tests
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package + test deps
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=src/gik_icechain \
            --cov-report=xml \
            --cov-report=term-missing \
            --timeout=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # 3. Integration Tests — run on every branch (local tmp-path, no cloud secrets)
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -m "integration" \
            --timeout=300

  # 4. Notebook smoke tests (quickstart + component walkthroughs)
  notebooks:
    name: Notebook Tests
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package + notebook deps
        run: pip install -e ".[dev]" nbmake

      - name: Run quickstart and walkthrough notebooks
        run: |
          pytest --nbmake \
            notebooks/00_quickstart.ipynb \
            notebooks/01_component1_walkthrough.ipynb \
            notebooks/02_component2_walkthrough.ipynb \
            notebooks/03_component3_walkthrough.ipynb \
            --nbmake-timeout=300 \
            -v
