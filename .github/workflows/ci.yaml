name: CI

on:
  push:
    branches: [main, develop, optimize]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev
      - uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "check src/ tests/ scripts/"
      - run: mypy src/gik_icechain/ --ignore-missing-imports

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev
      - run: |
          pytest tests/unit/ -v --tb=short \
            --cov=src/gik_icechain \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=45 \
            --timeout=120
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev
      - run: pytest tests/integration/ -v --tb=short -m integration --timeout=300
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL:      ${{ secrets.MINIO_ENDPOINT_URL }}

  notebooks:
    name: Notebook Tests (live MinIO)
    runs-on: ubuntu-latest
    needs: test-unit
    # The walkthrough runs real C1→C2→C3→run-all→benchmark against the live MinIO
    # store (no synthetic data). It depends on live infra + ECMWF S3 and runs the
    # full pipeline, so it is best-effort (non-blocking).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: "dev,viz"
      - name: Install eccodes system library (GRIB2 decode)
        run: sudo apt-get update && sudo apt-get install -y libeccodes0 libeccodes-tools
      - name: Download reference data (admin, thresholds, ENSO/IOD)
        run: |
          python scripts/tools.py download --component all
          python scripts/tools.py download-thresholds
      - name: Run live walkthrough notebook
        env:
          ECCODES_PYTHON_USE_FINDLIBS: "1"
          MINIO_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          pytest --nbmake notebooks/gik_icechain_walkthrough.ipynb \
            --nbmake-timeout=2400 --timeout=2400 -v
