name: CI

on:
  push:
    branches: [main, develop, optimize]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev
      - uses: astral-sh/ruff-action@v4.0.0
        with:
          args: "check src/ tests/ scripts/"
      - run: mypy src/gik_icechain/ --ignore-missing-imports

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev
      - run: |
          pytest tests/unit/ -v --tb=short \
            --cov=src/gik_icechain \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=45 \
            --timeout=120
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    continue-on-error: true  # requires live MinIO + ECMWF S3 — skipped in standard CI
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: dev
      - run: pytest tests/integration/ -v --tb=short -m integration --timeout=300
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL:      ${{ secrets.MINIO_ENDPOINT_URL }}

  notebooks:
    name: Notebook Tests (offline)
    runs-on: ubuntu-latest
    needs: test-unit
    # Enforced: these notebooks fall back to synthetic data when no live store
    # is configured (outputs.endpoint_url empty), so they run in standard CI.
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: "dev,viz"
      - run: |
          pytest --nbmake \
            notebooks/00_quickstart.ipynb \
            notebooks/02_component2_walkthrough.ipynb \
            notebooks/03_component3_walkthrough.ipynb \
            notebooks/04_benchmark_report.ipynb \
            --nbmake-timeout=300 \
            -v

  notebooks-live:
    name: Notebook Tests (live store)
    runs-on: ubuntu-latest
    needs: test-unit
    continue-on-error: true  # Component-1 walkthrough requires live MinIO data
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: "dev,viz"
      - run: pytest --nbmake notebooks/01_component1_walkthrough.ipynb --nbmake-timeout=600 -v
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL:      ${{ secrets.MINIO_ENDPOINT_URL }}
