# .github/workflows/ci.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Continuous Integration for GIK-IceChain
# Runs on every push and PR to main.
#
# Jobs:
#   1. lint      — ruff + mypy
#   2. test-unit — pytest (unit tests only, no AWS credentials needed)
#   3. test-int  — pytest integration tests (requires AWS, runs on main only)
#   4. notebooks — nbmake validates all notebooks render without error
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:

  # 1. Lint — disabled until ruff/mypy config is stabilised
  # lint:
  #   name: Lint (ruff + mypy)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: astral-sh/ruff-action@v3
  #       with:
  #         args: "check src/ tests/"
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}
  #         cache: pip
  #     - name: Install package for mypy
  #       run: pip install -e ".[dev]" mypy
  #     - name: mypy
  #       run: mypy src/gik_icechain/ --ignore-missing-imports

  #  2. Unit Tests
  test-unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test deps
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=src/gik_icechain \
            --cov-report=xml \
            --cov-report=term-missing \
            --timeout=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  #  3. Integration Tests (main branch only, requires AWS)
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    if: github.ref == 'refs/heads/main'
    environment: integration-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev,cloud]"

      - name: Configure AWS credentials (read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID_READONLY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_READONLY }}
          aws-region: eu-west-1

      - name: Run integration tests (5-day window)
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -m "integration" \
            --timeout=300
        env:
          GIK_TEST_START: "2024-10-01"
          GIK_TEST_END:   "2024-10-05"
          GIK_OUTPUT_BUCKET: ${{ secrets.GIK_TEST_BUCKET }}

  # 4. Notebook Tests — disabled (notebooks tested manually on Colab)
