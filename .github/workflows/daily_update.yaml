  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}
  #         cache: pip
  #     - run: pip install -e ".[viz]"
  #     - uses: aws-actions/configure-aws-credentials@v4
  #       with:
  #         aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
  #         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  #         aws-region: eu-west-1
  #     - name: Generate calendar summary JSON
  #       run: |
  #         python dashboard/storymaps/generate_storymaps.py \
  #           --exceedance-store ${{ secrets.GIK_EXCEEDANCE_STORE_URI }} \
  #           --risk-dir s3://${{ secrets.GIK_BUCKET }}/admin1_risk/ \
  #           --output dashboard/calendar_map/data/ \
  #           --date ${{ needs.ingest-daily-gik.outputs.processed_date }}
  #     - name: Commit dashboard data update
  #       run: |
  #         git config user.name  "gik-icechain-bot"
  #         git config user.email "bot@gik-icechain.earth"
  #         git add dashboard/calendar_map/data/
  #         git diff --staged --quiet || \
  #           git commit -m "data: update calendar for ${{ needs.ingest-daily-gik.outputs.processed_date }}"
  #         git push

  #  Monthly IceChunk compaction (runs on 1st of each month at 02:00 UTC)
  compact-icechunk:
    name: "Maintenance: Monthly IceChunk compaction"
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 1 * *'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -e ".[cloud]"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Compact IceChunk store
        run: |
          python - <<'EOF'
          from gik_icechain.conversion.icechunk_writer import IceChainStore
          import os, json
          store = IceChainStore(os.environ["GIK_ICECHUNK_STORE_URI"])
          store.create_or_open()
          result = store.compact(keep_days=30)
          print(json.dumps(result))
          EOF
        env:
          GIK_ICECHUNK_STORE_URI: ${{ secrets.GIK_ICECHUNK_STORE_URI }}

  #  Notify on failure — opens a GitHub Issue and posts a workflow annotation
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [ingest-daily-gik, update-exceedance, update-risk]
    if: failure() && github.event.schedule != '0 2 1 * *'
    permissions:
      issues: write
    steps:
      - name: Post workflow error annotation
        run: |
          echo "::error title=Daily pipeline failed::Pipeline failed for ${{ needs.ingest-daily-gik.outputs.processed_date }}. Check run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ needs.ingest-daily-gik.outputs.processed_date }}' || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[PIPELINE FAILURE] Daily update failed for ${date}`,
              body: `## Daily pipeline failure\n\n**Date**: ${date}\n**Run**: ${runUrl}\n\nOne or more pipeline jobs (C1 ingest / C2 exceedance / C3 risk) failed.\nPlease investigate and re-run the failed job manually if needed.\n\n_Auto-opened by \`daily_update.yaml\` \`notify-failure\` job._`,
              labels: ['pipeline-failure', 'automated'],
            });