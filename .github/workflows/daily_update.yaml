name: Daily Pipeline Update

# Real-time daily run: C2 reads yesterday's 00z IFS ENS forecast straight
# from the .index files on s3://ecmwf-forecasts (configs/realtime.yaml) -
# no C1 store, no catalog, no publication lag. C3 and the dashboard then
# consume the exceedance store as usual.
#
# Repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (required);
# GIK_BUCKET, GIK_EXCEEDANCE_STORE_URI (optional, default to the
# s3://gik-icechain production stores). All prerequisites (thresholds,
# admin boundaries, ENSO/IOD, eccodes, CHIRPS) are staged by the jobs.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date to process (YYYY-MM-DD, default: yesterday)"
        required: false
        default: ""

env:
  PYTHONIOENCODING: utf-8
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: eu-north-1
  GIK_EXCEEDANCE_STORE_URI: ${{ secrets.GIK_EXCEEDANCE_STORE_URI || 's3://gik-icechain/exceedance-zarr' }}
  GIK_BUCKET: ${{ secrets.GIK_BUCKET || 'gik-icechain' }}

jobs:

  resolve-date:
    name: "Resolve target forecast date"
    runs-on: ubuntu-latest
    outputs:
      processed_date: ${{ steps.resolve.outputs.processed_date }}
    steps:
      - name: Resolve date (input or yesterday)
        id: resolve
        run: |
          set -euo pipefail
          TARGET_DATE="${{ inputs.target_date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date -u -d "yesterday" +%F)
          fi
          if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::invalid TARGET_DATE: '$TARGET_DATE'" && exit 1
          fi
          echo "processed_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Target date: $TARGET_DATE"

  update-exceedance:
    name: "C2: Exceedance Zarr (real-time ECMWF source)"
    runs-on: ubuntu-latest
    needs: resolve-date
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: cloud
      - name: Install eccodes + ENSO/IOD index + GEV thresholds (C2 prerequisites)
        run: |
          sudo apt-get update && sudo apt-get install -y libeccodes0 libeccodes-tools
          python scripts/tools.py download --component enso_iod
          python scripts/tools.py download-thresholds
      - env:
          ECCODES_PYTHON_USE_FINDLIBS: "1"
        run: |
          gik-icechain exceedance \
            --config configs/realtime.yaml \
            --store  "unused-in-ecmwf-direct-mode" \
            --output "$GIK_EXCEEDANCE_STORE_URI" \
            --thresholds data/cmorph_thresholds/ \
            --start ${{ needs.resolve-date.outputs.processed_date }} \
            --end   ${{ needs.resolve-date.outputs.processed_date }}

  update-risk:
    name: "C3: Admin-1 risk"
    runs-on: ubuntu-latest
    needs: [resolve-date, update-exceedance]
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: cloud
      - name: Download admin boundaries + observed rainfall (C3 prerequisites)
        run: |
          python scripts/tools.py download --component admin
          PROC="${{ needs.resolve-date.outputs.processed_date }}"
          START=$(python -c "from datetime import date,timedelta;print(date.fromisoformat('$PROC')-timedelta(14))")
          python scripts/tools.py download-gpm --source chirps --start "$START" --end "$PROC"
      - run: |
          gik-icechain risk \
            --exceedance-store "$GIK_EXCEEDANCE_STORE_URI" \
            --output "s3://$GIK_BUCKET/admin1_risk" \
            --start ${{ needs.resolve-date.outputs.processed_date }} \
            --end   ${{ needs.resolve-date.outputs.processed_date }}

  update-dashboard:
    name: "Dashboard: calendar data"
    runs-on: ubuntu-latest
    needs: [resolve-date, update-risk]
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: viz
      - name: Build dashboard contract and publish to the store (no commit)
        run: |
          PROC="${{ needs.resolve-date.outputs.processed_date }}"
          # Pull the existing contract first: index.json merges, keeping date history.
          aws s3 sync "s3://$GIK_BUCKET/dashboard-data/" dashboard/web/public/data/ || true
          aws s3 sync "s3://$GIK_BUCKET/admin1_risk/" results/admin1_risk/
          python -m dashboard.data_pipeline.pipeline contract \
            --exceedance-store "$GIK_EXCEEDANCE_STORE_URI" \
            --results results/admin1_risk \
            --out dashboard/web/public \
            --date "$PROC"
          python -m dashboard.data_pipeline.pipeline overlays \
            --exceedance-store "$GIK_EXCEEDANCE_STORE_URI" \
            --out dashboard/web/public \
            --date "$PROC" \
          || echo "::warning::overlays failed for $PROC"
          python -m dashboard.data_pipeline.pipeline geojson \
            --boundaries results/admin1_risk/admin1_boundaries.geojson \
            --out dashboard/web/public
          bash scripts/publish_dashboard_data.sh \
            dashboard/web/public/data "s3://$GIK_BUCKET/dashboard-data"

  redeploy-pages:
    name: "Dashboard: redeploy Pages with fresh contract"
    needs: update-dashboard
    uses: ./.github/workflows/deploy-web.yaml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [resolve-date, update-exceedance, update-risk]
    if: failure()
    permissions:
      issues: write
    steps:
      - run: |
          echo "::error title=Daily pipeline failed::Failed for ${{ needs.resolve-date.outputs.processed_date }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ needs.resolve-date.outputs.processed_date }}' || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[PIPELINE FAILURE] ${date}`,
              body:  `**Date**: ${date}\n**Run**: ${runUrl}`,
              labels: ['pipeline-failure', 'automated'],
            });
