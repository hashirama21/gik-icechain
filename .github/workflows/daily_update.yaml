name: Daily Pipeline Update

# Repo secrets: MINIO_ENDPOINT_URL, MINIO_ACCESS_KEY, MINIO_SECRET_KEY,
# GIK_BUCKET, GIK_ICECHUNK_STORE_URI, GIK_EXCEEDANCE_STORE_URI.
# Credentials flow as plain AWS_* env vars: aws-actions/configure-aws-credentials
# validates via STS and rejects MinIO keys. All prerequisites (thresholds,
# admin boundaries, ENSO/IOD, eccodes, CHIRPS) are staged by the jobs themselves.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date to process (YYYY-MM-DD, default: yesterday)"
        required: false
        default: ""

env:
  PYTHONIOENCODING: utf-8
  AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
  AWS_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
  AWS_DEFAULT_REGION: eu-west-1

jobs:

  ingest-daily-gik:
    name: "C1: Ingest GIK -> IceChunk"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    outputs:
      processed_date: ${{ steps.ingest.outputs.processed_date }}
      commit_hash:    ${{ steps.ingest.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: cloud
      - name: Ingest GIK batch
        id: ingest
        run: |
          set -euo pipefail
          TARGET_DATE="${{ inputs.target_date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date -u -d "yesterday" +%F)
          fi
          if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::invalid TARGET_DATE: '$TARGET_DATE'" && exit 1
          fi
          gik-icechain convert \
            --start "$TARGET_DATE" \
            --end   "$TARGET_DATE" \
            --output-store ${{ secrets.GIK_ICECHUNK_STORE_URI }} \
            --output-json /tmp/ingest_result.json
          echo "processed_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          echo "commit_hash=$(python -c "import json; print(json.load(open('/tmp/ingest_result.json'))['commit_hash'])")" >> $GITHUB_OUTPUT

  update-exceedance:
    name: "C2: Exceedance Zarr"
    runs-on: ubuntu-latest
    needs: ingest-daily-gik
    environment: production
    timeout-minutes: 30
    steps:
      - name: Abort if C1 produced no commit
        run: |
          [ -n "${{ needs.ingest-daily-gik.outputs.commit_hash }}" ] || \
            { echo "::error title=Empty commit::No new data for ${{ needs.ingest-daily-gik.outputs.processed_date }}"; exit 1; }
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: cloud
      - name: Install eccodes + ENSO/IOD index (C2 prerequisites)
        run: |
          sudo apt-get update && sudo apt-get install -y libeccodes0 libeccodes-tools
          python scripts/tools.py download --component enso_iod
      - name: Stage GEV thresholds in the store if absent
        run: |
          EP=""
          [ -n "$AWS_ENDPOINT_URL" ] && EP="--endpoint-url $AWS_ENDPOINT_URL"
          if ! aws s3 ls $EP "s3://${{ secrets.GIK_BUCKET }}/cmorph_thresholds/" | grep -q .; then
            python scripts/tools.py download-thresholds
            python scripts/tools.py upload-thresholds
          fi
      - env:
          ECCODES_PYTHON_USE_FINDLIBS: "1"
        run: |
          gik-icechain exceedance \
            --store  ${{ secrets.GIK_ICECHUNK_STORE_URI }} \
            --output ${{ secrets.GIK_EXCEEDANCE_STORE_URI }} \
            --thresholds s3://${{ secrets.GIK_BUCKET }}/cmorph_thresholds/ \
            --start ${{ needs.ingest-daily-gik.outputs.processed_date }} \
            --end   ${{ needs.ingest-daily-gik.outputs.processed_date }}

  update-risk:
    name: "C3: Admin-1 risk"
    runs-on: ubuntu-latest
    needs: [ingest-daily-gik, update-exceedance]
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: cloud
      - name: Download admin boundaries + observed rainfall (C3 prerequisites)
        run: |
          python scripts/tools.py download --component admin
          PROC="${{ needs.ingest-daily-gik.outputs.processed_date }}"
          START=$(python -c "from datetime import date,timedelta;print(date.fromisoformat('$PROC')-timedelta(14))")
          python scripts/tools.py download-gpm --source chirps --start "$START" --end "$PROC"
      - run: |
          gik-icechain risk \
            --exceedance-store ${{ secrets.GIK_EXCEEDANCE_STORE_URI }} \
            --output s3://${{ secrets.GIK_BUCKET }}/admin1_risk \
            --start ${{ needs.ingest-daily-gik.outputs.processed_date }} \
            --end   ${{ needs.ingest-daily-gik.outputs.processed_date }}

  update-dashboard:
    name: "Dashboard: calendar data"
    runs-on: ubuntu-latest
    needs: [ingest-daily-gik, update-risk]
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: viz
      - name: Build dashboard contract and publish to the store (no commit)
        run: |
          PROC="${{ needs.ingest-daily-gik.outputs.processed_date }}"
          BUCKET="${{ secrets.GIK_BUCKET }}"
          EP=""
          [ -n "$AWS_ENDPOINT_URL" ] && EP="--endpoint-url $AWS_ENDPOINT_URL"
          # Pull the existing contract first: index.json merges, keeping date history.
          aws s3 sync $EP "s3://$BUCKET/dashboard-data/" dashboard/web/public/data/ || true
          aws s3 sync $EP "s3://$BUCKET/admin1_risk/" results/admin1_risk/
          python -m dashboard.data_pipeline.pipeline contract \
            --exceedance-store ${{ secrets.GIK_EXCEEDANCE_STORE_URI }} \
            --results results/admin1_risk \
            --out dashboard/web/public \
            --date "$PROC"
          python -m dashboard.data_pipeline.pipeline geojson \
            --boundaries results/admin1_risk/admin1_boundaries.geojson \
            --out dashboard/web/public
          bash scripts/publish_dashboard_data.sh \
            dashboard/web/public/data "s3://$BUCKET/dashboard-data" $EP

  redeploy-pages:
    name: "Dashboard: redeploy Pages with fresh contract"
    needs: update-dashboard
    uses: ./.github/workflows/deploy-web.yaml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [ingest-daily-gik, update-exceedance, update-risk]
    if: failure()
    permissions:
      issues: write
    steps:
      - run: |
          echo "::error title=Daily pipeline failed::Failed for ${{ needs.ingest-daily-gik.outputs.processed_date }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ needs.ingest-daily-gik.outputs.processed_date }}' || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[PIPELINE FAILURE] ${date}`,
              body:  `**Date**: ${date}\n**Run**: ${runUrl}`,
              labels: ['pipeline-failure', 'automated'],
            });
