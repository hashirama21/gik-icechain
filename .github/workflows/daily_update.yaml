name: Daily Pipeline Update

# ONE-TIME prerequisites (not per-run):
#   - Stage the 252 GEV threshold files on S3 once:
#       python scripts/tools.py download --component thresholds
#       python scripts/tools.py download-thresholds
#       python scripts/tools.py upload-thresholds   # -> s3://$GIK_BUCKET/cmorph_thresholds/
#   - Repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, GIK_BUCKET,
#       GIK_ICECHUNK_STORE_URI, GIK_EXCEEDANCE_STORE_URI.
# Per-run prerequisites (admin, ENSO/IOD, eccodes, CHIRPS) are installed by the
# jobs below.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date to process (YYYY-MM-DD, default: yesterday)"
        required: false
        default: ""

env:
  PYTHONIOENCODING: utf-8

jobs:

  ingest-daily-gik:
    name: "C1: Ingest GIK -> IceChunk"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    outputs:
      processed_date: ${{ steps.ingest.outputs.processed_date }}
      commit_hash:    ${{ steps.ingest.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: cloud
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1
      - name: Ingest GIK batch
        id: ingest
        run: |
          TARGET_DATE="${{ inputs.target_date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(python -c "from datetime import date, timedelta; print(date.today() - timedelta(1))")
          fi
          gik-icechain convert \
            --start "$TARGET_DATE" \
            --end   "$TARGET_DATE" \
            --output-store ${{ secrets.GIK_ICECHUNK_STORE_URI }} \
            --output-json /tmp/ingest_result.json
          echo "processed_date=$TARGET_DATE" >> $GITHUB_OUTPUT
          echo "commit_hash=$(python -c "import json; print(json.load(open('/tmp/ingest_result.json'))['commit_hash'])")" >> $GITHUB_OUTPUT

  update-exceedance:
    name: "C2: Exceedance Zarr"
    runs-on: ubuntu-latest
    needs: ingest-daily-gik
    environment: production
    timeout-minutes: 30
    steps:
      - name: Abort if C1 produced no commit
        run: |
          [ -n "${{ needs.ingest-daily-gik.outputs.commit_hash }}" ] || \
            { echo "::error title=Empty commit::No new data for ${{ needs.ingest-daily-gik.outputs.processed_date }}"; exit 1; }
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: cloud
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1
      - name: Install eccodes + ENSO/IOD index (C2 prerequisites)
        run: |
          sudo apt-get update && sudo apt-get install -y libeccodes0 libeccodes-tools
          python scripts/tools.py download --component enso_iod
      - env:
          ECCODES_PYTHON_USE_FINDLIBS: "1"
        run: |
          gik-icechain exceedance \
            --store  ${{ secrets.GIK_ICECHUNK_STORE_URI }} \
            --output ${{ secrets.GIK_EXCEEDANCE_STORE_URI }} \
            --thresholds s3://${{ secrets.GIK_BUCKET }}/cmorph_thresholds/ \
            --start ${{ needs.ingest-daily-gik.outputs.processed_date }} \
            --end   ${{ needs.ingest-daily-gik.outputs.processed_date }}

  update-risk:
    name: "C3: Admin-1 risk"
    runs-on: ubuntu-latest
    needs: update-exceedance
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: cloud
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1
      - name: Download admin boundaries + observed rainfall (C3 prerequisites)
        run: |
          python scripts/tools.py download --component admin
          PROC="${{ needs.ingest-daily-gik.outputs.processed_date }}"
          START=$(python -c "from datetime import date,timedelta;print(date.fromisoformat('$PROC')-timedelta(14))")
          python scripts/tools.py download-gpm --source chirps --start "$START" --end "$PROC"
      - run: |
          gik-icechain risk \
            --exceedance-store ${{ secrets.GIK_EXCEEDANCE_STORE_URI }} \
            --output /tmp/admin1_risk/ \
            --start ${{ needs.ingest-daily-gik.outputs.processed_date }} \
            --end   ${{ needs.ingest-daily-gik.outputs.processed_date }}
          aws s3 sync /tmp/admin1_risk/ s3://${{ secrets.GIK_BUCKET }}/admin1_risk/

  update-dashboard:
    name: "Dashboard: calendar data"
    runs-on: ubuntu-latest
    needs: update-risk
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pipeline-setup
        with:
          extras: viz
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1
      - run: |
          python -m dashboard.data_pipeline.pipeline contract \
            --exceedance-store ${{ secrets.GIK_EXCEEDANCE_STORE_URI }} \
            --results results/admin1_risk \
            --out dashboard/web/public \
            --date ${{ needs.ingest-daily-gik.outputs.processed_date }}
      - name: Commit dashboard data
        run: |
          git config user.name  "gik-icechain-bot"
          git config user.email "bot@gik-icechain.earth"
          git add dashboard/web/public/data/
          git diff --staged --quiet || { \
            git commit -m "data: update calendar for ${{ needs.ingest-daily-gik.outputs.processed_date }} [skip ci]" && \
            git push origin HEAD:${{ github.ref_name }}; }

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [ingest-daily-gik, update-exceedance, update-risk]
    if: failure()
    permissions:
      issues: write
    steps:
      - run: |
          echo "::error title=Daily pipeline failed::Failed for ${{ needs.ingest-daily-gik.outputs.processed_date }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ needs.ingest-daily-gik.outputs.processed_date }}' || 'unknown';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[PIPELINE FAILURE] ${date}`,
              body:  `**Date**: ${date}\n**Run**: ${runUrl}`,
              labels: ['pipeline-failure', 'automated'],
            });
