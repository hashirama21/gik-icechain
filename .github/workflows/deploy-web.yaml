name: Deploy Dashboard (Next.js)

# Builds the GIK-IceChain dashboard (static export) and publishes it to GitHub
# Pages. The per-day data contract is served at runtime from S3 via
# NEXT_PUBLIC_DATA_BASE (built and published by the daily_update workflow); it is
# not committed. configure-pages enables Pages (source: GitHub Actions) so the
# project site is served under /gik-icechain/.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/web/**"
      - ".github/workflows/deploy-web.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - run: npm ci || npm install
      - name: Configure GitHub Pages (enable + source = Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /gik-icechain
          NEXT_PUBLIC_TITILER_BASE: ${{ vars.TITILER_BASE }}
          NEXT_PUBLIC_COG_BASE: ${{ vars.COG_BASE }}
          # Per-day contract fetched at runtime from S3 (published by
          # daily_update); not committed. If unset, the app falls back to the
          # bundled /data (empty in CI).
          NEXT_PUBLIC_DATA_BASE: ${{ vars.DATA_BASE }}
        run: npm run build
      - name: Disable Jekyll (serve _next/ underscore dirs verbatim)
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
