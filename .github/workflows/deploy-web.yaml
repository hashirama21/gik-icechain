name: Deploy Dashboard (Next.js)

# Builds the GIK-IceChain dashboard (static export) and publishes it to GitHub
# Pages. The per-day data contract is pulled from the store at build time and
# bundled into the Pages artifact, so the app serves it same-origin over HTTPS
# (no public bucket, no CORS, no mixed content). NEXT_PUBLIC_DATA_BASE stays as
# an optional override for an external HTTPS data host. configure-pages enables
# Pages (source: GitHub Actions) so the project site is served under
# /gik-icechain/.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/web/**"
      - ".github/workflows/deploy-web.yaml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/web/package-lock.json
      - run: npm ci || npm install
      - name: Configure GitHub Pages (enable + source = Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pull data contract into the artifact (served same-origin)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
          GIK_BUCKET: ${{ secrets.GIK_BUCKET }}
        run: |
          BUCKET="${GIK_BUCKET:-gik-icechain}"
          ENDPOINT_FLAG=""
          if [ -n "$MINIO_ENDPOINT_URL" ]; then
            ENDPOINT_FLAG="--endpoint-url $MINIO_ENDPOINT_URL"
          fi
          if aws s3 ls $ENDPOINT_FLAG "s3://$BUCKET/dashboard-data/" > /dev/null 2>&1; then
            aws s3 sync $ENDPOINT_FLAG "s3://$BUCKET/dashboard-data/" public/data/
            echo "Contract bundled: $(find public/data -name '*.json' | wc -l) JSON files"
          else
            echo "No dashboard-data at s3://$BUCKET/ - deploying with bundled /data only"
          fi
      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /gik-icechain
          NEXT_PUBLIC_TITILER_BASE: ${{ vars.TITILER_BASE }}
          NEXT_PUBLIC_COG_BASE: ${{ vars.COG_BASE }}
          # Optional override: external HTTPS data host. Empty = the app reads
          # the contract bundled above, same-origin from Pages.
          NEXT_PUBLIC_DATA_BASE: ${{ vars.DATA_BASE }}
        run: npm run build
      - name: Disable Jekyll (serve _next/ underscore dirs verbatim)
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
