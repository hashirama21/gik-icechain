name: GIK pipeline setup
description: Checkout, setup Python 3.12, and install the package.
inputs:
  extras:
    description: pip extras group (dev, cloud, viz, full)
    default: dev
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - run: pip install -e ".[${{ inputs.extras }}]"
      shell: bash
