# E2E test config — full pipeline against the dev MinIO store.
#
# Thin override of configs/default.yaml (deep-merged on top): only the storage
# endpoints differ. Everything else (manifest_aware, all 7 windows, manifest
# splitting, full East Africa bbox, 196 admin-1 units, CRMA clusters) is
# inherited unchanged so the E2E run exercises the real production path.
#
# Storage = dev MinIO (public Azure IP, reachable from GitHub-hosted runners).
# Credentials come from the environment (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# = in dev). The ECMWF virtual chunks are still read from the real
# public AWS S3 (the writer/loader set an explicit AWS endpoint internally).

outputs:
  icechunk_store_uri: "s3://gik-icechain/e2e-test-store"
  icechunk_store_region: "eu-west-1"
  endpoint_url: "http://20.116.218.195:9000"   # dev MinIO
  exceedance_store_uri: "s3://gik-icechain/e2e-test-exceedance"
  exceedance_icechunk_uri: ""
  risk_icechunk_uri: ""
  risk_output_dir: "results/e2e_test/admin1_risk/"
  dashboard_data_dir: "dashboard/calendar_map/data/"

component2:
  manifest_aware:
    enabled: true
    fetch_workers: 8        # runner has fast bandwidth to AWS + MinIO
    min_members: 10
  parallel:
    max_workers: 2
    multiprocessing: true
    day_timeout_s: 900
