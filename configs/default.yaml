# GIK-IceChain v2.0 - Default Pipeline Configuration

sources:
  gik_hf_dataset: "E4DRR/gik-ecmwf-par"
  gik_catalog_file: "catalog.parquet"
  ecmwf_s3_bucket: "ecmwf-forecasts"
  ecmwf_s3_region: "eu-central-1"
  ecmwf_s3_no_sign: true
  gpm_imerg_path: "data/gpm_imerg/"
  emdat_path: "data/emdat/east_africa_floods.csv"
  admin_boundaries_path: "data/admin_boundaries/east_africa_admin1.geojson"

outputs:
  icechunk_store_uri: "s3://gik-icechain/gik-icechain-store"
  icechunk_store_region: "eu-west-1"
  endpoint_url: ""
  exceedance_store_uri: "s3://gik-icechain/exceedance-zarr"
  exceedance_icechunk_uri: ""
  risk_icechunk_uri: ""
  # Risk outputs go to S3 by default (prod: no local disk). Override per run with
  # `--output <local dir>` or set a local path here for dev.
  risk_output_dir: "s3://gik-icechain/admin1_risk"
  dashboard_data_dir: "dashboard/web/public/data/"

component1:
  run_hours: [0]
  variables: ["tp", "2t", "10u", "10v", "ro"]
  icechunk:
    branch: "main"
    commit_message_template: "GIK ingest: {date}T{run_hour:02d}Z"
    tag_format: "{date}T{run_hour:02d}Z"
    # Manifest splitting (VirtualiZarr #884) - keeps manifest fragments bounded
    # at 1200+ day scale. Splits each array's manifest along `step` every N positions.
    manifest_splitting: true
    manifest_split_dim: "step"
    manifest_split_size: 1000
  # The bucket goes back to 2023-01-18, but pre-2024-02 dates live under
  # `0p4-beta/` at 0.4 deg (451x900), not `0p25/` (721x1440). Ingesting them means
  # handling both grids - C1 already does; C2 derives the grid per GRIB message.
  gap_fill:
    enabled: true
    aws_batch_job: "deploy/aws/batch_job_definition.json"
    lithops_config: "deploy/aws/lithops_config.yaml"
    workers: 50

component2:
  compute_variables: ["tp"]
  risk_evidence_variables: ["2t", "10u", "10v", "ro"]
  # IFS tp is decoded in metres; CMORPH thresholds are in mm. Convert m -> mm.
  precip_scale_to_mm: 1000.0

  # Flood-relevance floor (mm) per window - suppresses arid false alarms where
  # the GEV return-period threshold collapses to a few mm.
  flood_floor_mm: {3: 15, 6: 20, 12: 25, 24: 30, 48: 40, 72: 50, 168: 75}

  step_resolution_h: 6
  max_forecast_h: null
  step_buffer: 1
  # When a window is finer than the step resolution (e.g. 3h on 6-hourly data):
  # true = skip it with a warning, false = raise an error and abort the day.
  skip_subresolution_windows: true

  windows_h: [3, 6, 12, 24, 48, 72, 168]
  return_periods: [2, 5, 10, 20, 40, 100]

  active_profile: null
  window_profiles:
    flash_flood:
      windows_h: [3, 6, 12]
      return_periods: [2, 5, 10]
      max_forecast_h: 24
    medium_range:
      windows_h: [24, 48, 72]
      return_periods: [5, 10, 20]
      max_forecast_h: 72
    full:
      windows_h: [3, 6, 12, 24, 48, 72, 168]
      return_periods: [2, 5, 10, 20, 40, 100]
      max_forecast_h: 168

  spatial:
    bbox: [-14.5, 25, 20, 54]   # [lat_min, lat_max, lon_min, lon_max]
    lat_dim: "latitude"
    lon_dim: "longitude"

  manifest_aware:
    enabled: true
    fetch_workers: 4
    min_members: 10

  byte_range_coalescing:
    enabled: true
    max_gap_bytes: 65536
    max_merged_bytes: 5242880

  parallel:
    max_workers: null
    multiprocessing: true
    day_timeout_s: 300
    mem_gb_per_worker: 3.0
    mem_headroom_fraction: 0.1

  # cmorph_path selects the threshold arm (same filenames in each; see
  # configs/ablation_*.yaml). Regenerate: current files predate the OND fix.
  thresholds:
    adaptive: true
    enso_iod_index_path: "data/enso_iod_index.csv"
    enso_nino34_threshold: 0.5
    iod_dmi_threshold: 0.4
    cmorph_path: "data/cmorph_thresholds/"
    cmorph_hf_dataset: "E4DRR/virtualizarr-stores"
    min_samples_for_gev: 30
    fallback_strategy: "neutral"
    fallback_rate_warning_threshold: 0.20

  dask:
    scheduler: "distributed"
    n_workers: 4
    threads_per_worker: 2
    memory_limit: "4GB"
    memory_fraction: 0.6
    dashboard_address: ":8787"
    chunk_dims:
      member: 1
      step: 1
      latitude: 50
      longitude: 50

  output_chunks:
    date: 30
    latitude: 100
    longitude: 100
    window: -1
    return_period: -1

# Innovation 4. OFF here so the daily run stays single-track; enable via
# configs/aifs_comparison.yaml. AIFS ENS exists on s3://ecmwf-forecasts only
# from ~2025-07-05 (earlier dates 404); IFS goes back to ~2024-03-01.
aifs_track:
  enabled: false
  aifs_store_uri: "s3://gik-icechain/aifs-icechain-store"
  exceedance_store_uri: "s3://gik-icechain/aifs-exceedance-zarr"
  variables: ["tp"]
  run_hours: [0]
  max_step_h: 360
  step_resolution_h: 6
  n_members: 51
  comparison_enabled: true
  comparison_output_dir: "results/aifs_comparison/"

component3:
  crma:
    cpt_path: null
    use_refined_cpts: false
  api:
    enabled: true
    decay_factor: 0.8
    initial_api_mm: 20.0
  crma_model:
    gpm_obs_normal_mmday: 5.0
    gpm_obs_above_mmday: 25.0
    api_threshold_normal_mm: 30.0
    api_threshold_saturated_mm: 80.0
    spatial_threshold_regional: 0.25
    spatial_threshold_extensive: 0.75
    consecutive_signal_threshold: 3
    soil_memory_days: 7
    hazard_medium_threshold: 0.15
    hazard_high_threshold: 0.40
    signal_threshold_prob: 0.15
    rp_signal: 5
    rp_signal_options: [2, 5]   # risk_state produced for both → dashboard toggles
    # Per-RP Forecast_Hazard boundaries [medium, high]: 2yr exceedances run
    # structurally higher, so their boundaries sit above the 5yr ones.
    hazard_thresholds_by_rp:
      2: [0.30, 0.60]
      5: [0.15, 0.40]
    # Data_Confidence dampening of the compound score [Low, Medium, High].
    # Medium is the precip-ensemble norm → kept near-neutral so it doesn't
    # structurally veto strong signals (was [0.5,0.8,1.0] → all-Green bug).
    confidence_damping: [0.8, 0.95, 1.0]
    compound_score_thresholds:
      fresh: [1.5, 4.0, 7.0]
      prolonged: [1.0, 3.0, 6.0]
    compound_cpt_buckets:
      fresh:
        low:  [0.85, 0.12, 0.02, 0.01]
        mid:  [0.20, 0.60, 0.15, 0.05]
        mod:  [0.05, 0.20, 0.55, 0.20]
        high: [0.02, 0.08, 0.30, 0.60]
      prolonged:
        low:  [0.75, 0.18, 0.05, 0.02]
        mid:  [0.10, 0.45, 0.30, 0.15]
        mod:  [0.02, 0.13, 0.45, 0.40]
        high: [0.01, 0.04, 0.20, 0.75]
    cluster_weights:
      equatorial_east: {forecast: 2.0, obs: 1.5, api: 1.5}
      horn_arid:       {forecast: 2.5, obs: 1.0, api: 2.0}
      great_rift:      {forecast: 2.0, obs: 1.5, api: 1.8}
      nile_basin:      {forecast: 1.8, obs: 2.0, api: 1.5}
    api_transition:
      - [0.70, 0.20, 0.05]
      - [0.25, 0.55, 0.35]
      - [0.05, 0.25, 0.60]
    # Cost-loss decision trigger (Murphy 1977; Coughlan de Perez 2015): label the
    # highest tier whose cumulative posterior P(>=tier) reaches its C/L ratio,
    # instead of argmax. Lifts Orange-level day x unit recall 0.006 -> 0.138 on
    # the Apr-2024 EA window, exposing skill the argmax left stranded at Yellow.
    # taus are REV-DERIVED (Richardson 2000), not guessed: `calibrate-cost-loss`
    # over the 19-file / 4522-unit-day fresh multi-season corpus (FbF alphas
    # 0.10/0.20/0.30) maximises Relative Economic Value per tier. REV is strong
    # at Yellow (0.243) but modest at Orange (0.076) / Red (0.030); tau_red's raw
    # optimum (0.06) was clamped up to tau_orange by the non-decreasing-order
    # constraint. Caveat: corpus still includes Apr-2024, so partly in-sample.
    cost_loss:
      enabled: true
      tau_yellow: 0.14
      tau_orange: 0.19
      tau_red: 0.19
      # Continuous-severity split for the degenerate tau_orange==tau_red boundary:
      # a saturated Red below this magnitude drops to Orange (initial value; tune
      # with the satellite panel like the taus).
      severity_red_split: 0.30
    # Continuous within-tier severity, exposed as severity_score (additive).
    severity:
      enabled: true
      w_exceedance: 0.45
      w_tail: 0.25
      w_spatial: 0.20
      w_api: 0.10
    # Riverine-aware Forecast_Hazard: escalate on the pooled upstream ratio fed
    # by component3.riverine (catchment-routed Shabelle/Juba/Sudd floods).
    riverine_aware_hazard: true
    riverine_medium_ratio: 0.80
    riverine_high_ratio: 1.00
    riverine_extreme_ratio: 1.30
  emdat_refinement:
    enabled: true
    laplace_alpha: 1.0
    negative_sample_ratio: 3.0
    output_cpt_path: "results/validation/refined_cpts.json"
  aggregation:
    # Hazard exceedance → admin-1: "max" (or a high percentile "p90"/"p95")
    # so a localized flood peak is not averaged away over the whole unit.
    # Complementary to the Spatial_Coverage BN node (which captures % of area).
    method: "max"
    min_coverage_fraction: 0.5
  # Riverine feed: pool upstream forecast intensity into riverine_ratio via the
  # curated admin-1 river topology (data-side of riverine_aware_hazard).
  riverine:
    enabled: true
    upstream_map_path: data/river_basins/upstream_admin1.yaml
    attenuation: 0.9
    aggregate: max
  output:
    geojson: true
    zarr: true
    eahw_export: true

dashboard:
  titiler:
    endpoint: ""
    cog_bucket: "gik-icechain"
  calendar_map:
    signal_threshold_yellow: 0.15
    signal_threshold_orange: 0.30
    signal_threshold_red: 0.50
  veda_ui:
    base_url: "https://hashirama21.github.io/gik-icechain/storymaps"

logging:
  level: "INFO"
  format: "json"
  output: "stderr"
