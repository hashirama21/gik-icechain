# CI end-to-end config — runs the full pipeline on a GitHub Actions runner.
#
# Overrides only what differs from configs/default.yaml (deep-merged on top):
#   * Local filesystem stores instead of MinIO (runners cannot reach the
#     private MinIO IP; a runner has its own ephemeral disk).
#   * endpoint_url cleared so IceChunk/obstore use real AWS S3 for the public
#     ECMWF virtual chunks (anonymous, no credentials needed).
#
# Everything else (manifest_aware, all 7 windows, manifest splitting, full
# East Africa bbox, 196 admin-1 units, CRMA clusters) is inherited unchanged
# from default.yaml so the CI run exercises the real production path.

outputs:
  icechunk_store_uri: "/tmp/gik/icechunk-store"
  icechunk_store_region: "eu-west-1"
  endpoint_url: ""                       # no MinIO — default AWS endpoint
  exceedance_store_uri: "/tmp/gik/exceedance-zarr"
  exceedance_icechunk_uri: ""
  risk_icechunk_uri: ""
  risk_output_dir: "results/ci_e2e/admin1_risk/"
  dashboard_data_dir: "dashboard/calendar_map/data/"

component2:
  manifest_aware:
    enabled: true
    fetch_workers: 8                     # runner has fast AWS bandwidth
    min_members: 10
  parallel:
    max_workers: 2
    multiprocessing: true
    day_timeout_s: 900
