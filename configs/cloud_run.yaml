# configs/cloud_run.yaml
# Google Cloud Run Job configuration for GIK-IceChain gap-fill batch.

sources:
  gik_hf_dataset: "E4DRR/gik-ecmwf-par"
  cmorph_thresholds_path: "gs://gik-icechain-gcs/cmorph_thresholds/"
  admin_boundaries_path:  "gs://gik-icechain-gcs/admin_boundaries/east_africa_admin1.gpkg"

outputs:
  icechunk_store_uri:   "s3://gik-icechain/gik-icechain-store"
  exceedance_store_uri: "s3://gik-icechain/exceedance-zarr"

component1:
  run_hours: [0]
  variables: ["tp", "2t", "10u", "10v", "ro"]
  gap_fill:
    enabled: true
    workers: 50

component2:
  windows_h:      [3, 6, 12, 24, 48, 72, 168]
  return_periods: [2, 5, 10, 20, 40, 100]
  dask:
    scheduler: "distributed"
    n_workers: 32
    threads_per_worker: 2
    memory_limit: "8GB"

logging:
  level:  "INFO"
  format: "json"
