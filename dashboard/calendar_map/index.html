<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIK-IceChain &mdash; Flood Risk Calendar Map</title>
  <link rel="stylesheet" href="calendar.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body>
  <header>
    <h1>GIK-IceChain &mdash; East Africa Flood Risk</h1>
    <p class="subtitle">
      Daily admin-1 risk levels from the CRMA Bayesian Network
    </p>
  </header>

  <main>
    <section id="controls">
      <label for="date-picker">Date:</label>
      <input type="date" id="date-picker" />
    </section>

    <div id="calendar-container"></div>
    <div id="map-container"></div>
  </main>

  <footer>
    <p>
      Data: ECMWF IFS ENS via
      <a href="https://huggingface.co/datasets/E4DRR/gik-ecmwf-par">GIK</a>
      &bull; GPM IMERG &bull; ICPAC CRMA (EGU26-18323)
    </p>
  </footer>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>
